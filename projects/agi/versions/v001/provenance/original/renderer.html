<!doctype html><meta charset="utf-8"><title>AGI · Three music video studies</title><style>body{margin:0;background:#03080e;display:grid;place-items:center;height:100vh}canvas{width:min(100vw,177.77vh);height:auto}</style><canvas id="film" width="1920" height="1080"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d',{alpha:false}),W=1920,H=1080,TAU=Math.PI*2;
let features,lyrics,mode='abstract';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,ease=x=>{x=clamp(x);return x*x*(3-2*x)},hash=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const particles=Array.from({length:420},(_,i)=>({a:hash(i)*TAU,b:Math.acos(2*hash(i+500)-1),r:hash(i+700),z:hash(i+1500)}));
function line(x1,y1,x2,y2,color,width=1){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function circle(x,y,r,color,width=1){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.arc(x,y,Math.max(.1,r),0,TAU);g.stroke()}
function txt(text,x,y,size,color='#f2f5f2',align='left',weight=500,font='Arial'){g.font=`${weight} ${size}px ${font}`;g.fillStyle=color;g.textAlign=align;g.fillText(text,x,y)}
function glow(x,y,r,color){let gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,color);gr.addColorStop(1,'transparent');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function background(t,accent='#123648'){g.fillStyle='#040810';g.fillRect(0,0,W,H);glow(1000+180*Math.sin(t*.07),430,900,accent);for(let i=0;i<100;i++){let x=hash(i+41)*W,y=hash(i+199)*H;g.fillStyle=`rgba(182,229,255,${.12+.25*hash(i+17)})`;g.fillRect(x,y,1.5,1.5)}}
function sphere(t,p,cx=960,cy=535,R=330,col='100,220,237',form=0){let pts=[];for(let i=0;i<particles.length;i++){let v=particles[i],a=v.a+t*.19,b=v.b;let r=R*(1+.04*p*Math.sin(a*5+t*3));let x=Math.sin(b)*Math.cos(a)*r,y=Math.cos(b)*r,z=Math.sin(b)*Math.sin(a)*r;if(form===1){y+=Math.sin(a*3+t)*80;x*=1+.12*Math.sin(t*.4)}let perspective=1000/(1000+z);pts.push([cx+x*perspective,cy+y*perspective,z,perspective])}g.globalCompositeOperation='lighter';glow(cx,cy,R*1.6,`rgba(${col},.1)`);for(let i=0;i<pts.length;i++){let a=pts[i];for(let j=i+1;j<Math.min(i+9,pts.length);j++){let b=pts[j],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d<92)line(a[0],a[1],b[0],b[1],`rgba(${col},${(1-d/92)*.3})`,1.1)}g.fillStyle=`rgba(${col},${.35+.45*a[3]})`;g.beginPath();g.arc(a[0],a[1],(1.5+p*.7)*a[3],0,TAU);g.fill()}g.globalCompositeOperation='source-over';}
function tunnel(t,p,col='90,214,255'){g.save();g.translate(960,530);g.rotate(Math.sin(t*.13)*.1);for(let k=0;k<22;k++){let z=((k/22+t*.11)%1),r=35+z*z*1380;g.strokeStyle=`rgba(${col},${z*.6})`;g.lineWidth=1+z*2;g.beginPath();for(let j=0;j<=6;j++){let a=j*TAU/6+t*.08;let x=Math.cos(a)*r,y=Math.sin(a)*r*.6;if(j===0)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke()}for(let j=0;j<24;j++){let a=j*TAU/24+t*.08;line(Math.cos(a)*40,Math.sin(a)*24,Math.cos(a)*1900,Math.sin(a)*1140,`rgba(${col},.12)`)}glow(0,0,200+80*p,`rgba(${col},.25)`);g.restore()}
function wavefield(t,p){for(let row=0;row<32;row++){g.beginPath();for(let j=0;j<=100;j++){let x=j/100*W,y=400+row*18+Math.sin(j*.085+t*.6+row*.24)*(40+p*55)+Math.sin(j*.19-t*.4)*22;if(j===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle=`rgba(${80+row*3},${155+row*2},230,${.13+row/100})`;g.lineWidth=1;g.stroke()}}
function vortex(t,p){g.save();g.translate(960,540);g.rotate(-.2);for(let ring=0;ring<32;ring++){let r=145+ring*17;g.beginPath();for(let j=0;j<=150;j++){let a=j/150*TAU,warp=1+Math.sin(a*3+t*.7+ring*.14)*.06;let x=Math.cos(a+t*.14)*r*warp,y=Math.sin(a+t*.14)*r*warp*(.27+ring*.007);if(j===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle=`rgba(255,${155+ring},${70+ring*2},${.35-ring*.007})`;g.lineWidth=1.5;g.stroke()}glow(0,0,130+30*p,'rgba(255,158,79,.45)');g.fillStyle='#020509';g.beginPath();g.ellipse(0,0,136,91,0,0,TAU);g.fill();g.restore()}
function city(t,p,collapse=0){g.save();g.translate(0,Math.sin(t*.45)*6);glow(980,350,560,'rgba(45,168,188,.2)');circle(1050,330,190,'rgba(79,230,237,.25)',2);for(let layer=0;layer<3;layer++){for(let i=0;i<37;i++){let bw=40+hash(i+11+layer*130)*55,x=i*61-100+(layer-1)*37,y=700+layer*73,h=(90+hash(i+60+layer*99)*280)*(1+layer*.15);x+=Math.sin(t*.5+i)*collapse*60;y+=collapse*hash(i+51)*180;g.fillStyle=['#071c29','#0a2634','#0d3341'][layer];g.fillRect(x,y-h,bw,h+450);line(x,y-h,x+bw,y-h,'rgba(118,238,241,.32)',1.2);for(let j=0;j<Math.floor(h/22);j++){for(let k=0;k<Math.floor(bw/14);k++){let v=hash(i*39+j*7+k+layer*159);if(v>.42){g.fillStyle=`rgba(${v>.85?'255,161,86':'85,229,234'},${.18+.45*p})`;g.fillRect(x+6+k*14,y-h+10+j*22,4,7)}}}}}for(let j=0;j<22;j++){let z=j/22,y=770+z*z*370;line(0,y,W,y,'rgba(67,166,181,.18)');line(960+(j-11)*100,770,960+(j-11)*360,1080,'rgba(67,166,181,.15)')}g.restore()}
function android(t,p,cx=960,cy=570,scale=1){g.save();g.translate(cx,cy);g.scale(scale,scale);let sway=Math.sin(t*.7)*8;g.translate(sway,0);glow(0,-70,260,'rgba(95,224,230,.16)');g.strokeStyle='#55ced9';g.lineWidth=2.4;g.fillStyle='#091a28';g.beginPath();g.moveTo(-68,-184);g.quadraticCurveTo(-87,-285,0,-292);g.quadraticCurveTo(88,-284,68,-184);g.lineTo(42,-147);g.lineTo(38,-100);g.lineTo(125,-75);g.lineTo(158,110);g.lineTo(117,120);g.lineTo(84,-22);g.lineTo(73,130);g.lineTo(52,325);g.lineTo(10,325);g.lineTo(0,155);g.lineTo(-10,325);g.lineTo(-52,325);g.lineTo(-73,130);g.lineTo(-84,-22);g.lineTo(-117,120);g.lineTo(-158,110);g.lineTo(-125,-75);g.lineTo(-38,-100);g.lineTo(-42,-147);g.closePath();g.fill();g.stroke();line(-48,-218,-14,-218,'#c4ffff',5);line(14,-218,48,-218,'#c4ffff',5);circle(0,-13,34+3*p,'#65f2e8',2);glow(0,-13,72,'rgba(64,252,231,.36)');for(let j=0;j<6;j++){line(-58,45+j*13,58,45+j*13,'rgba(110,215,220,.36)')}g.restore()}
function lab(t,p,opening){g.save();for(let i=0;i<8;i++){let x=180+i*225;line(x,90,x,830,'rgba(78,129,164,.18)');line(x-32,96,x+32,96,'#194157',3)}g.strokeStyle='rgba(89,198,221,.35)';g.lineWidth=2;g.strokeRect(720,170,480,725);circle(960,872,230,'rgba(89,198,221,.4)',2);circle(960,872,170,'rgba(89,198,221,.25)');android(t,p,960,520,.85);for(let i=0;i<9;i++){let y=235+i*64;line(320,y,650,y,'rgba(122,224,238,.15)');for(let j=0;j<32;j++){let h=hash(i*40+j)*18*(1+p);g.fillStyle='rgba(108,229,238,.5)';g.fillRect(1350+j*9,y-h,3,h)}}txt('A G I',400,202,45,'#b4e5eb');txt(opening?'BOOT SEQUENCE':'AUTONOMOUS SYSTEM',400,245,17,'#4e8497', 'left',500,'monospace');g.restore()}
function shards(t,p){g.save();g.translate(960,520);for(let i=0;i<110;i++){let a=hash(i)*TAU+t*.1,r=90+hash(i+400)*900,s=18+hash(i+700)*52;g.save();g.translate(Math.cos(a)*r,Math.sin(a)*r*.62);g.rotate(a+t*(hash(i+900)-.5));g.strokeStyle=`rgba(255,${90+hash(i)*120},90,.48)`;g.lineWidth=2;g.strokeRect(-s*.5,-s*.8,s,s*1.6);g.restore()}glow(0,0,300,'rgba(255,87,51,.18)');g.restore()}
function hud(t,name,color='#759aaa'){txt('AGI',82,86,26,'#effbff','left',700);txt(name.toUpperCase(),82,118,15,color,'left',500,'monospace');txt('MV / 01',W-82,86,18,color,'right',500,'monospace');line(82,1004,W-82,1004,'rgba(132,206,224,.13)');line(82,1004,82+(W-164)*t/features.duration,1004,color,2);txt('A STUDY IN MACHINE CONSCIOUSNESS',82,1042,12,color,'left',500,'monospace');txt(String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0'),W-82,1042,15,color,'right',500,'monospace')}
function abstract(t,p){const cuts=[0,22.1,37.58,58.28,74.1,94.64,109,117.3,140.55,156.66];let idx=cuts.findIndex((v,i)=>i<cuts.length-1&&t>=v&&t<cuts[i+1]);if(idx<0)idx=8;let local=t-cuts[idx];background(t,idx===5||idx===7?'rgba(80,25,23,.55)':'rgba(12,51,68,.7)');if(idx===0||idx===2){sphere(t,p,960,530,idx===0?320:410,'103,219,236',idx===2?1:0);for(let i=0;i<4;i++){g.save();g.translate(960,530);g.rotate(t*.08+i*.4);g.strokeStyle='rgba(121,232,240,.18)';g.beginPath();g.ellipse(0,0,500+i*16,180+i*24,0,0,TAU);g.stroke();g.restore()}}else if(idx===1||idx===4)tunnel(t,p,idx===4?'240,134,99':'83,225,225');else if(idx===3)wavefield(t,p);else if(idx===5)shards(t,p);else if(idx===6||idx===7)vortex(t,p);else{sphere(t,p,960,530,260-100*ease(local/16),'154,207,224');glow(960,530,500,'rgba(112,190,234,.08)')}hud(t,['SIGNAL','CONNECTION','EMERGENCE','ACCELERATION','RECURSION','INSTABILITY','EVENT HORIZON','SINGULARITY','AFTERGLOW'][idx]);if(local<1){g.fillStyle=`rgba(175,235,242,${(1-local)*.055})`;g.fillRect(0,0,W,H)}}
function narrative(t,p){background(t,'rgba(13,40,56,.8)');let name;if(t<22.1){lab(t,p,t<10);name='01 / THE FIRST SPARK'}else if(t<37.58){city(t,p);android(t,p,960,580,.92);name='02 / BEYOND THE ROOM'}else if(t<58.28){city(t,p);g.save();g.globalAlpha=.7;sphere(t,p,960,420,370,'72,211,238',1);g.restore();android(t,p,420,655,.62);for(let i=0;i<6;i++)line(425,644,700+i*130,300+hash(i)*360,'rgba(73,224,216,.35)',1.8);name='03 / EVERYWHERE AT ONCE'}else if(t<74.1){tunnel(t,p);android(t,p,960,600,1.15);name='04 / THE THRESHOLD'}else if(t<94.64){city(t,p);sphere(t,p,960,320,220,'255,175,116');for(let j=0;j<14;j++){let x=130+j*125;line(x,600,x,140,'rgba(249,156,88,.28)',2);circle(x,140+Math.sin(t+j)*30,9,'#ecad78',2)}name='05 / THE OPTIMIZER'}else if(t<109){city(t,p,ease((t-94.64)/12));g.save();g.globalAlpha=ease((t-94.64)/6);shards(t,p);g.restore();android(t,p,960,650,.7);name='06 / LOSS OF CONTROL'}else if(t<140.55){vortex(t,p);android(t,p,960,600,.65);g.save();g.globalAlpha=.35;sphere(t,p,960,480,450,'246,163,109');g.restore();name='07 / THE LAST QUESTION'}else{city(t,p);glow(1050,280,540,'rgba(229,169,108,.23)');android(t,p,960,655,.55);name='08 / AFTER THE SIGNAL'}hud(t,name);if(t<1.6){g.fillStyle=`rgba(4,8,16,${1-ease(t/1.6)})`;g.fillRect(0,0,W,H)}}
function drawWords(words,t,y,maxWidth){let size=96;g.font=`700 ${size}px Arial`;while(g.measureText(words.map(w=>w.w).join(' ')).width>maxWidth&&size>45){size-=2;g.font=`700 ${size}px Arial`}const total=g.measureText(words.map(w=>w.w).join(' ')).width;let x=(W-total)/2;const space=g.measureText(' ').width;for(let w of words){let progress=clamp((t-w.start)/Math.max(.08,w.end-w.start));let wid=g.measureText(w.w).width;g.fillStyle=t>=w.end?'#cc573d':'#252a31';g.fillText(w.w,x,y);if(t>=w.start&&t<w.end){g.save();g.beginPath();g.rect(x,y-size*1.1,wid*progress,size*1.3);g.clip();g.fillStyle='#e66442';g.fillText(w.w,x,y);g.restore();line(x,y+22,x+wid,y+22,'#e66442',5)}x+=wid+space}}
function typography(t,p){const chorus=[22.1,58.28,94.64,117.3].some(x=>t>=x&&t<x+15);g.fillStyle=chorus?'#11191e':'#ede8df';g.fillRect(0,0,W,H);let ink=chorus?'#eee9df':'#222b30',muted=chorus?'#658086':'#8c9693',accent='#e36643';g.save();g.globalAlpha=chorus?.09:.055;g.translate(960,530);g.rotate(-.19);for(let i=-3;i<4;i++)txt('AGI   /   P(DOOM)   /   AGI',Math.sin(t*.1+i)*70,i*210,175,ink,'center',900);g.restore();let index=lyrics.lines.findIndex((l,i)=>t>=l.start&&t<(lyrics.lines[i+1]?.start??l.end+.8));let l=lyrics.lines[index];if(l&&t>l.end+1.8)l=null;txt('AGI',100,109,47,ink,'left',800);txt('WORD / SIGNAL / RHYTHM',W-100,104,17,muted,'right',500,'monospace');line(100,145,W-100,145,muted,1);if(l){txt(String(index+1).padStart(2,'0'),100,262,19,accent,'left',500,'monospace');if(index>0)txt(lyrics.lines[index-1].text,960,363,32,muted,'center',400);g.textAlign='left';const words=l.words??[];if(chorus){let size=96;g.font=`700 ${size}px Arial`;while(g.measureText(l.text).width>1600&&size>44){size-=2;g.font=`700 ${size}px Arial`}let width=g.measureText(words.map(w=>w.w).join(' ')).width,x=(W-width)/2;for(let w of words){g.fillStyle=t>=w.start?accent:ink;g.fillText(w.w,x,580);x+=g.measureText(w.w+' ').width}}else drawWords(words,t,580,1600);if(lyrics.lines[index+1])txt(lyrics.lines[index+1].text,960,744,32,muted,'center',400)}else{let outro=t>140;txt(outro?'AFTER THE SIGNAL':'AGI',960,545,outro?95:210,ink,'center',800);txt(outro?'THE MUSIC CONTINUES':'A MUSIC VIDEO IN THREE STUDIES',960,640,22,muted,'center',500,'monospace')}for(let i=0;i<96;i++){let h=(12+hash(i+400)*60)*(.3+p);g.fillStyle=accent;g.fillRect(100+i*18,915-h,7,h)}line(100,972,W-100,972,muted,1);line(100,972,100+(W-200)*t/features.duration,972,accent,3);txt('LYRIC STUDY / ENGLISH ORIGINAL',100,1018,15,muted,'left',500,'monospace');txt('03',W-100,1018,20,ink,'right',700)}
window.renderFrame=(t,kind=mode)=>{let f=features.frames[Math.min(features.frames.length-1,Math.floor(t*24))]??[0,0,0],p=f[1]*.5+f[0]*.5;g.globalAlpha=1;g.globalCompositeOperation='source-over';if(kind==='lyrics')typography(t,p);else if(kind==='narrative')narrative(t,p);else abstract(t,p);let fade=1-ease((features.duration-t)/1.8);if(fade>0){g.fillStyle=`rgba(${kind==='lyrics'?'17,25,30':'4,8,16'},${fade})`;g.fillRect(0,0,W,H)}return c.toDataURL('image/jpeg',.94).split(',')[1]};
window.ready=Promise.all([fetch('audio-features-v001.json').then(r=>r.json()),fetch('reference-lyric-timing-v001.json').then(r=>r.json())]).then(([a,b])=>{features=a;lyrics=b;let q=new URLSearchParams(location.search);mode=q.get('mode')??'abstract';window.renderFrame(Number(q.get('t')??5),mode)});
</script>
