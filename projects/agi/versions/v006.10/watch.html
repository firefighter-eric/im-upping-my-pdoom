<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>I'm Upping My P(doom) · V006.10</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101012;color:#f0ede7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}
main{width:min(100vw,calc((100vh - 64px) * 16 / 9))}.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#101012}
video{display:block;width:100%;height:100%}.seek{position:absolute;left:0;top:94.166667%;width:100%;height:32px;transform:translateY(-50%);cursor:ew-resize;touch-action:none;outline:none}
.track,.fill{position:absolute;top:14px;left:0;height:4px;background:#403c38;width:100%;pointer-events:none}.fill{background:#ff792b;width:0}
.thumb{position:absolute;top:10px;left:0;width:12px;height:12px;border-radius:50%;background:#ff792b;transform:translateX(-50%);opacity:0;pointer-events:none}.seek:hover .thumb,.seek:focus-visible .thumb,.seek.dragging .thumb{opacity:1}.seek:focus-visible{outline:2px solid #f0ede7;outline-offset:-2px}
.controls{height:64px;display:flex;align-items:center;gap:20px;padding:0 24px;font-size:14px}.controls button{border:1px solid #534e46;border-radius:6px;padding:8px 14px;background:#211e1b;color:inherit;cursor:pointer;font:inherit}.controls button:hover{border-color:#ff792b}.controls output{font-variant-numeric:tabular-nums}.spacer{flex:1}
main:fullscreen{width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#101012}main:fullscreen .stage,main:fullscreen .controls{width:min(100vw,calc((100vh - 64px) * 16 / 9));flex-shrink:0}
@media(max-width:640px){.controls{gap:12px;padding:0 12px}}
</style>
</head>
<body><main>
<div class="stage" id="stage">
<video id="video" preload="metadata" playsinline src="./outputs/LLMV_001_V006_R010_001_companion_v006.10.mp4" poster="./poster.jpg"></video>
<div class="seek" id="seek" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="156.666667" aria-valuenow="0">
<div class="track"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div>
</div>
</div>
<div class="controls"><button id="play" type="button">播放</button><output id="time">00:00 / 02:37</output><span class="spacer"></span><button id="full" type="button">全屏</button></div>
<noscript><a href="./outputs/LLMV_001_V006_R010_001_companion_v006.10.mp4">打开视频</a></noscript>
</main>
<script>
const video=document.getElementById('video'),seek=document.getElementById('seek'),fill=document.getElementById('fill'),thumb=document.getElementById('thumb'),time=document.getElementById('time'),play=document.getElementById('play'),stage=document.getElementById('stage');
let dragging=false,resume=false,animation=0;
const format=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function sync(){const duration=Number.isFinite(video.duration)?video.duration:9400/60;const ratio=Math.max(0,Math.min(1,video.currentTime/duration));fill.style.width=thumb.style.left=`${ratio*100}%`;seek.setAttribute('aria-valuemax',String(duration));seek.setAttribute('aria-valuenow',String(video.currentTime));seek.setAttribute('aria-valuetext',`${format(video.currentTime)}，共 ${format(Math.ceil(duration))}`);time.textContent=`${format(video.currentTime)} / ${format(Math.ceil(duration))}`;play.textContent=video.paused?'播放':'暂停';}
function animate(){sync();if(!video.paused&&!video.ended)animation=requestAnimationFrame(animate);}
async function toggle(){if(video.paused){try{await video.play();}catch(error){time.textContent='点击播放重试';}}else video.pause();}
function seekAt(clientX){if(!Number.isFinite(video.duration))return;const box=seek.getBoundingClientRect();video.currentTime=Math.max(0,Math.min(1,(clientX-box.left)/box.width))*video.duration;sync();}
seek.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;resume=!video.paused;video.pause();seek.classList.add('dragging');seek.setPointerCapture(e.pointerId);seekAt(e.clientX);});
seek.addEventListener('pointermove',e=>{if(dragging)seekAt(e.clientX);});
function endDrag(){if(!dragging)return;dragging=false;seek.classList.remove('dragging');if(resume)video.play().catch(()=>{});}
seek.addEventListener('pointerup',endDrag);seek.addEventListener('pointercancel',endDrag);
seek.addEventListener('keydown',e=>{const d=video.duration;if(!Number.isFinite(d))return;let t=video.currentTime;if(e.key==='ArrowLeft')t-=5;else if(e.key==='ArrowRight')t+=5;else if(e.key==='Home')t=0;else if(e.key==='End')t=d;else return;e.preventDefault();video.currentTime=Math.max(0,Math.min(d,t));sync();});
for(const event of ['loadedmetadata','timeupdate','seeked','pause','ended'])video.addEventListener(event,sync);
video.addEventListener('play',()=>{cancelAnimationFrame(animation);animate();});
play.addEventListener('click',toggle);video.addEventListener('click',toggle);
document.getElementById('full').addEventListener('click',async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector('main').requestFullscreen();});
sync();
</script>
</body></html>
